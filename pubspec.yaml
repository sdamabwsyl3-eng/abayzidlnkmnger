name: abayazidlnkmnger
description: منظومة إدارة وتوزيع شبكات Starlink وميكروتك وطباعة الكروت الحرارية
publish_to: 'none'
version: 4.2.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.5.0
  pdf: ^3.10.7
  printing: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: lib/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: lib/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
