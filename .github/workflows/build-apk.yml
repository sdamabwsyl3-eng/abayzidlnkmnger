name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Android project files
        run: flutter create --org com.example . --platforms android

      - name: Grant INTERNET permission for release builds
        # Flutter's generated android/app/src/main/AndroidManifest.xml has no
        # <uses-permission> block by default. The debug variant gets INTERNET
        # access automatically via android/app/src/debug/AndroidManifest.xml,
        # but a --release build does not inherit that, so every network call
        # (Supabase auth/API) fails with "Failed host lookup" at runtime.
        run: |
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>#' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Set Arabic app label
        # Replace whatever android:label flutter create generated (it varies
        # by Flutter version/template) with the Arabic app name, so it shows
        # correctly after installation regardless of the generated default.
        run: |
          sed -i 's#android:label="[^"]*"#android:label="أبا يزيد لنك منجر"#' android/app/src/main/AndroidManifest.xml
          grep -q 'أبا يزيد لنك منجر' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
